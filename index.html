<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أعمالي</title>

  <meta name="theme-color" content="#f4f6fb">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></svg>
        </span>
        أعمالي
      </a>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="ابحث عن مشروع" aria-label="ابحث عن مشروع" autocomplete="off">
      </label>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الداكن">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="banner" id="banner" aria-roledescription="carousel" aria-label="مشاريع مميزة"></section>

    <nav class="chips" aria-label="تصفية">
      <button class="chip is-active" data-filter="all" type="button">الكل</button>
      <button class="chip" data-filter="app" type="button">تطبيقات</button>
      <button class="chip" data-filter="web" type="button">مواقع</button>
    </nav>

    <section class="section" data-section="app">
      <h2 class="section-title">التطبيقات</h2>
      <p class="hint">💡 التحميل مباشر لملف APK. إذا ما بلّش التحميل، شغّل VPN وجرّب مرة تانية.</p>
      <div class="grid" id="grid-app"></div>
    </section>

    <section class="section" data-section="web">
      <h2 class="section-title">المواقع</h2>
      <div class="grid" id="grid-web"></div>
    </section>

    <p class="empty" id="empty" hidden>لا توجد نتائج مطابقة.</p>

    <a class="channel" id="channel" href="https://t.me/nsmatd" target="_blank" rel="noopener">
      <span class="channel-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.6 3c.9-.3 1.6.2 1.3 1.3z"/></svg>
      </span>
      <span class="channel-text">
        <strong>قناة نسمات دينية 🌿</strong>
        <span>تلاوات قرآنية، أدعية، ونصائح إيمانية</span>
      </span>
      <span class="btn channel-btn">انضم</span>
    </a>
  </main>

  <footer class="footer">
    <p>تواصل معي</p>
    <div class="social">
      <a id="tg" class="social-btn tg" href="#" target="_blank" rel="noopener" aria-label="تيليغرام">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.6 3c.9-.3 1.6.2 1.3 1.3z"/></svg>
        تيليغرام
      </a>
      <a id="wa" class="social-btn wa" href="#" target="_blank" rel="noopener" aria-label="واتساب">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-5-4.3-5.1-4.5-.2-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.3.5-.4.5c-.2.2-.3.3-.1.6.2.3.8 1.4 1.8 2.2 1.2 1.1 2.3 1.4 2.6 1.6.3.1.5.1.7-.1l1-1.2c.2-.3.4-.3.7-.2l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg>
        واتساب
      </a>
    </div>
    <small>© <span id="year"></span> حسين الطويل</small>
  </footer>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <img id="sheetIcon" class="app-icon" alt="">
      <div class="sheet-titles">
        <h3 id="sheetTitle"></h3>
        <p id="sheetMeta"></p>
      </div>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <a id="sheetAction" class="btn btn-primary btn-wide" target="_blank" rel="noopener"></a>
      <p class="hint" id="sheetHint" hidden>إذا ما بلّش التحميل، شغّل VPN وجرّب مرة تانية.</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js?v=6"></script>
</body>
</html>
